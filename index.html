<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SourceTech — Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:        #050B18;
  --surface:   rgba(255,255,255,0.04);
  --border:    rgba(255,255,255,0.08);
  --indigo:    #6366F1;
  --cyan:      #22D3EE;
  --purple:    #A855F7;
  --text:      #E0F2FE;
  --muted:     #64748B;
  --card-bg:   rgba(10,20,45,0.6);
}

html, body { height: 100%; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}

/* ─── Canvas ─── */
canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
}

/* ─── Ambient blobs ─── */
.blobs {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}
.blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.18;
  animation: drift 18s ease-in-out infinite alternate;
}
.blob-1 {
  width: 600px; height: 600px;
  background: radial-gradient(circle, #6366F1, transparent 70%);
  top: -15%; left: -10%;
  animation-duration: 22s;
}
.blob-2 {
  width: 500px; height: 500px;
  background: radial-gradient(circle, #22D3EE, transparent 70%);
  bottom: -15%; right: -10%;
  animation-duration: 18s;
  animation-delay: -8s;
}
.blob-3 {
  width: 350px; height: 350px;
  background: radial-gradient(circle, #A855F7, transparent 70%);
  top: 40%; left: 50%;
  transform: translate(-50%, -50%);
  animation-duration: 26s;
  animation-delay: -4s;
}
@keyframes drift {
  0%   { transform: translate(0, 0) scale(1); }
  100% { transform: translate(40px, 30px) scale(1.08); }
}

/* ─── Main card ─── */
.card {
  position: relative;
  z-index: 10;
  max-width: 740px;
  width: 90%;
  padding: 64px 56px 52px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 28px;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  text-align: center;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.04) inset,
    0 40px 80px rgba(0,0,0,0.6),
    0 0 120px rgba(99,102,241,0.12);
  animation: fadeUp 1s cubic-bezier(.16,1,.3,1) forwards;
  opacity: 0;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(32px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ─── Logo mark ─── */
.logo-wrap {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 32px;
  animation: fadeUp 1s .15s cubic-bezier(.16,1,.3,1) both;
}
.logomark {
  position: relative;
  width: 52px; height: 52px;
  flex-shrink: 0;
}
.logomark svg {
  width: 100%; height: 100%;
}
.logomark img {
  width: 100%; height: 100%;
  object-fit: contain;
}
.orbit {
  position: absolute;
  inset: -8px;
  border-radius: 50%;
  border: 1px solid rgba(99,102,241,0.35);
  animation: spin 8s linear infinite;
}
.orbit::after {
  content: '';
  position: absolute;
  top: -3px; left: 50%;
  transform: translateX(-50%);
  width: 6px; height: 6px;
  background: var(--indigo);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--indigo);
}
.orbit-2 {
  inset: -16px;
  border-color: rgba(34,211,238,0.2);
  animation: spin 14s linear infinite reverse;
}
.orbit-2::after {
  background: var(--cyan);
  box-shadow: 0 0 10px var(--cyan);
}
@keyframes spin { to { transform: rotate(360deg); } }

.logo-text {
  font-family: 'Syne', sans-serif;
  font-size: 36px;
  font-weight: 800;
  letter-spacing: -0.5px;
  line-height: 1;
}
.logo-text span { color: var(--cyan); }

/* ─── Badge ─── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px;
  background: rgba(99,102,241,0.12);
  border: 1px solid rgba(99,102,241,0.3);
  border-radius: 100px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #A5B4FC;
  margin-bottom: 28px;
  animation: fadeUp 1s .25s cubic-bezier(.16,1,.3,1) both;
}
.badge-dot {
  width: 6px; height: 6px;
  background: var(--cyan);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--cyan);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: .5; transform: scale(0.7); }
}

/* ─── Headline ─── */
.headline {
  font-family: 'Syne', sans-serif;
  font-size: clamp(32px, 5vw, 52px);
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -1px;
  margin-bottom: 20px;
  animation: fadeUp 1s .35s cubic-bezier(.16,1,.3,1) both;
}
.headline .grad {
  background: linear-gradient(120deg, var(--indigo), var(--cyan), var(--purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

/* ─── Body ─── */
.body-text {
  font-size: 16px;
  font-weight: 400;
  color: #94A3B8;
  line-height: 1.75;
  max-width: 520px;
  margin: 0 auto 36px;
  animation: fadeUp 1s .45s cubic-bezier(.16,1,.3,1) both;
}

/* ─── Pills ─── */
.pills {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-bottom: 40px;
  animation: fadeUp 1s .5s cubic-bezier(.16,1,.3,1) both;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 100px;
  font-size: 13px;
  color: #94A3B8;
}
.pill-icon { font-size: 14px; }

/* ─── CTA ─── */
.cta-wrap {
  display: flex;
  gap: 14px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 48px;
  animation: fadeUp 1s .6s cubic-bezier(.16,1,.3,1) both;
}
.btn-primary {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 30px;
  border-radius: 14px;
  background: linear-gradient(135deg, var(--indigo), #4F46E5);
  color: #fff;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  letter-spacing: 0.01em;
  transition: transform 0.25s, box-shadow 0.25s;
  box-shadow: 0 4px 24px rgba(99,102,241,0.35), 0 0 0 1px rgba(255,255,255,0.08) inset;
  overflow: hidden;
}
.btn-primary::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 100%);
  pointer-events: none;
}
.btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(99,102,241,0.5); }

.btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 14px 24px;
  border-radius: 14px;
  background: transparent;
  border: 1px solid var(--border);
  color: #94A3B8;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  font-weight: 500;
  text-decoration: none;
  transition: border-color 0.2s, color 0.2s, transform 0.2s;
}
.btn-ghost:hover { border-color: rgba(255,255,255,0.2); color: var(--text); transform: translateY(-2px); }

/* ─── Divider ─── */
.divider {
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border), transparent);
  margin-bottom: 28px;
}

/* ─── Footer ─── */
.footer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  animation: fadeUp 1s .7s cubic-bezier(.16,1,.3,1) both;
}
.footer-copy {
  font-size: 13px;
  color: var(--muted);
}
.socials {
  display: flex;
  gap: 10px;
}
.social-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px; height: 34px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  text-decoration: none;
  font-size: 15px;
  transition: color 0.2s, border-color 0.2s, transform 0.2s;
}
.social-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); transform: translateY(-2px); }

/* ─── Responsive ─── */
@media (max-width: 600px) {
  .card { padding: 44px 28px 38px; }
  .footer-row { justify-content: center; }
}

@media (prefers-reduced-motion: reduce) {
  .orbit, .orbit-2, .blob { animation: none; }
}
</style>

<script>
/* ─── Particle mesh canvas ─── */
(function() {
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  let W, H, particles, mouse = { x: -9999, y: -9999 };
  const COUNT = 80, CONNECT_DIST = 130, MOUSE_DIST = 160;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
    init();
  }

  function rand(a, b) { return Math.random() * (b - a) + a; }

  function init() {
    particles = Array.from({ length: COUNT }, () => ({
      x:  rand(0, W), y:  rand(0, H),
      vx: rand(-0.25, 0.25), vy: rand(-0.25, 0.25),
      r:  rand(1, 2.5)
    }));
  }

  function dist(a, b) {
    const dx = a.x - b.x, dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // update
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
    });

    // connections
    for (let i = 0; i < particles.length; i++) {
      const a = particles[i];
      for (let j = i + 1; j < particles.length; j++) {
        const b = particles[j];
        const d = dist(a, b);
        if (d < CONNECT_DIST) {
          const alpha = (1 - d / CONNECT_DIST) * 0.4;
          ctx.beginPath();
          ctx.strokeStyle = `rgba(99,102,241,${alpha})`;
          ctx.lineWidth = 1;
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
      // mouse proximity lines
      const dm = dist(a, mouse);
      if (dm < MOUSE_DIST) {
        const alpha = (1 - dm / MOUSE_DIST) * 0.6;
        ctx.beginPath();
        ctx.strokeStyle = `rgba(34,211,238,${alpha})`;
        ctx.lineWidth = 1;
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(mouse.x, mouse.y);
        ctx.stroke();
      }
    }

    // dots
    particles.forEach(p => {
      const dm = dist(p, mouse);
      const lit = dm < MOUSE_DIST;
      ctx.beginPath();
      ctx.arc(p.x, p.y, lit ? p.r * 1.6 : p.r, 0, Math.PI * 2);
      ctx.fillStyle = lit ? 'rgba(34,211,238,0.7)' : 'rgba(99,102,241,0.5)';
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('touchmove', e => {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
  }, { passive: true });

  resize();
  draw();
})();
</script>
